[package]
name = "kataster"
version = "0.17.0"
authors = ["Boris Boutillier <boris.boutillier@gmail.com>"]
edition = "2024"
repository = "https://github.com/Bobox214/Kataster"
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 3

[dependencies]
bevy = { version = "0.20", features = ["bevy_remote"] }
leafwing-input-manager = "0.22"
rand = "0.10"
bevy_hanabi = "0.20"
avian2d = { version = "0.8" , features = [ "debug-plugin" ] } 
